name: Build

on:
  push:
    tags-ignore:
      - release-*
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 60
    permissions: {}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TOOLS=Yes
          -DSELF_TEST=Yes
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - if: runner.os == 'Windows'
        name: Create Zip Windows
        run: powershell Compress-Archive build/Server PlixMC-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.zip

      - if: runner.os != 'Windows'
        name: Create Zip Linux
        run: zip -r PlixMC-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.zip build/Server

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlixMC-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-${{ github.run_number }}
          path: PlixMC-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.zip
          if-no-files-found: error
          retention-days: 14
